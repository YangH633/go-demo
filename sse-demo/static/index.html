<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSE Demo</title>
    <style>
        body { max-width: 720px; margin: 40px auto; padding: 0 16px; font-family: sans-serif; }
        button { padding: 8px 16px; }
        pre { padding: 16px; background: #f5f5f5; max-height: 400px; overflow: auto; }
    </style>
</head>
<body>
    <h1>SSE Demo</h1>
    <button id="connectBtn" onclick="connect()">连接</button>
    <button id="disconnectBtn" onclick="disconnect()" disabled>断开</button>
    <button onclick="messages.textContent = ''">清空消息</button>
    <p id="status">未连接</p>
    <pre id="messages"></pre>
    <script>
        let source = null;
        const statusLabel = document.getElementById('status');
        const messages = document.getElementById('messages');
        const connectBtn = document.getElementById('connectBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');

        function connect() {
            if (source) return;
            // 1. EventSource 发起 GET 请求并持续接收事件。
            // SSE 只负责接收；客户端提交数据可以另外使用 fetch/POST。
            source = new EventSource('/events');
            connectBtn.disabled = true;
            disconnectBtn.disabled = false;
            statusLabel.textContent = '连接中…';
            source.onopen = () => {
                statusLabel.textContent = '已连接';
            };
            // 2. 浏览器解析 data: 和分隔空行，event.data 就是消息内容。
            source.onmessage = (event) => {
                messages.textContent += event.data + '\n';
                messages.scrollTop = messages.scrollHeight;
            };
            // 3. 断线会自动重连，不要在这里 close，否则会停止重连。
            // 此 demo 不补发历史消息，重连后只接收新消息。
            source.onerror = () => {
                statusLabel.textContent = '连接中断，等待自动重连…';
            };
        }

        function disconnect() {
            // 4. 主动停止接收时关闭连接，同时停止自动重连。
            source?.close();
            source = null;
            statusLabel.textContent = '未连接';
            connectBtn.disabled = false;
            disconnectBtn.disabled = true;
        }
    </script>
</body>
</html>
